<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The seven context dimensions</title><style>body{margin:0;background:#f4f1e8;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.wrap{max-width:960px;margin:auto;padding:20px}svg{display:block;width:100%;height:auto;border:1px solid rgba(11,23,57,.14)}</style></head><body><main class="wrap">
<svg viewBox="0 0 960 600" role="img" aria-labelledby="ctx-7q-title ctx-7q-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ctx-7q-title">Seven dimensions resolve one task context</title><desc id="ctx-7q-desc">What, why, how, for what, which, who and where are dimensions attached to shared knowledge units rather than seven duplicate documents. Every dimension can be resolved, partial, unknown, conflicted, stale or not required.</desc>
<defs><pattern id="ctx-7q-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".8" fill="#0b1739" opacity=".10"/></pattern><marker id="ctx-7q-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#526079"/></marker><style>.card{fill:#fffdf7;stroke:#0b1739;stroke-opacity:.24}.t{font:700 16px Inter,ui-sans-serif,system-ui;fill:#0b1739}.s{font:12px Inter,ui-sans-serif,system-ui;fill:#526079}.m{font:600 10px ui-monospace,SFMono-Regular,monospace;letter-spacing:.1em}.line{fill:none;stroke:#526079;stroke-width:1.2;marker-end:url(#ctx-7q-arrow)}.slot{fill:#2458e8;fill-opacity:.06;stroke:#2458e8;stroke-opacity:.55}</style></defs>
<rect width="960" height="600" fill="#f4f1e8"/><rect width="960" height="600" fill="url(#ctx-7q-grid)" opacity=".4"/>
<text x="48" y="54" class="t" font-size="25">Seven questions, one knowledge model</text><text x="48" y="80" class="s">A KnowledgeUnit may answer several dimensions. The task decides which dimensions are required.</text>
<!-- connectors -->
<path class="line" d="M110 242V374Q110 390 126 390H344"/><path class="line" d="M232 242V342Q232 358 248 358H344"/><path class="line" d="M354 242V326"/><path class="line" d="M476 242V326"/><path class="line" d="M598 242V326"/><path class="line" d="M720 242V342Q720 358 704 358H616"/><path class="line" d="M842 242V374Q842 390 826 390H616"/>
<!-- seven slots -->
<rect class="slot" x="50" y="128" width="120" height="114" rx="8"/><text x="66" y="156" class="m" fill="#2458e8">WHAT</text><text x="66" y="184" class="t">¿Qué?</text><text x="66" y="207" class="s">state · change</text><text x="66" y="225" class="s">behavior</text>
<rect class="card" x="172" y="128" width="120" height="114" rx="8"/><text x="188" y="156" class="m" fill="#2458e8">WHY</text><text x="188" y="184" class="t">¿Por qué?</text><text x="188" y="207" class="s">cause · trade-off</text><text x="188" y="225" class="s">history</text>
<rect class="card" x="294" y="128" width="120" height="114" rx="8"/><text x="310" y="156" class="m" fill="#2458e8">HOW</text><text x="310" y="184" class="t">¿Cómo?</text><text x="310" y="207" class="s">mechanism</text><text x="310" y="225" class="s">procedure</text>
<rect class="card" x="416" y="128" width="120" height="114" rx="8"/><text x="432" y="156" class="m" fill="#2458e8">FOR WHAT</text><text x="432" y="184" class="t">¿Para qué?</text><text x="432" y="207" class="s">purpose · DoD</text><text x="432" y="225" class="s">invariant</text>
<rect class="card" x="538" y="128" width="120" height="114" rx="8"/><text x="554" y="156" class="m" fill="#2458e8">WHICH</text><text x="554" y="184" class="t">¿Cuál?</text><text x="554" y="207" class="s">selection</text><text x="554" y="225" class="s">priority</text>
<rect class="card" x="660" y="128" width="120" height="114" rx="8"/><text x="676" y="156" class="m" fill="#2458e8">WHO</text><text x="676" y="184" class="t">¿Quién?</text><text x="676" y="207" class="s">actor · owner</text><text x="676" y="225" class="s">authority</text>
<rect class="card" x="782" y="128" width="120" height="114" rx="8"/><text x="798" y="156" class="m" fill="#2458e8">WHERE</text><text x="798" y="184" class="t">¿Dónde?</text><text x="798" y="207" class="s">scope · symbols</text><text x="798" y="225" class="s">environment</text>
<!-- shared model -->
<rect class="slot" x="344" y="326" width="272" height="130" rx="10"/><text x="368" y="358" class="m" fill="#2458e8">SHARED KNOWLEDGE UNIT</text><text x="368" y="390" class="t">Evidence-backed context</text><text x="368" y="416" class="s">scope · provenance · authority · confidence</text><text x="368" y="438" class="s">revision · validity · conflicts · relations</text>
<text x="48" y="510" class="m" fill="#526079">PER TASK STATE</text><text x="48" y="538" class="s">resolved · partial · unknown · conflicted · stale · not-required</text><text x="48" y="568" class="s">Time is transverse metadata, not an eighth question.</text>
</svg></main></body></html>
